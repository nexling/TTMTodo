# Included from TTMFlow project nginx:
#   include /mnt/Websites/MagicTODO/deploy/nginx-todo.conf;
# Uses the same wildcard cert as flow.takttimemodular.com (*.takttimemodular.com).

server {
    listen       80;
    server_name  todo.takttimemodular.com;
    return 301 https://$host$request_uri;
}

# DDNS hostname is not on the TLS cert — send browsers to the real name.
server {
    listen       80;
    server_name  todotakttimemodular.freemyip.com;
    return 301 https://todo.takttimemodular.com$request_uri;
}

server {
    listen       443 ssl;
    http2        on;
    server_name  todo.takttimemodular.com;
    ssl_certificate      /etc/letsencrypt/live/flow.takttimemodular.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/flow.takttimemodular.com/privkey.pem;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;
    client_max_body_size 32m;

    location /api/live {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 32m;
    }
}
